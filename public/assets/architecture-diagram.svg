  <text x="858" y="763" class="h">Backend API + Database</text>
  <text x="858" y="795" class="t">Shared schedules, audit, automated reminders</text>
  <text x="763" y="856" class="small">• Login, roles, and audit history</text>
  <text x="763" y="886" class="small">• Scheduled college reminder emails</text>

  <rect x="1305" y="690" width="333" height="230" rx="14" class="panel"/>
  <text x="1305" y="656" class="label">Client Value</text>
  <text x="1340" y="756" class="num">01</text><text x="1385" y="754" class="t">Commission visibility</text>
  <text x="1340" y="812" class="num">02</text><text x="1385" y="810" class="t">Instalment forecast</text>
  <text x="1340" y="868" class="num">03</text><text x="1385" y="866" class="t">College follow-up</text>

  <path class="line" d="M397 370 C438 370 462 370 500 370"/>
  <path class="line" d="M895 370 C935 370 960 370 995 370"/>
  <path class="line" d="M1175 538 C980 600 735 668 596 785"/>
  <path class="dash" d="M620 805 C655 805 685 805 720 805"/>
  <path class="line" d="M1175 805 C1225 805 1260 805 1300 805"/>

  <rect x="112" y="980" width="1526" height="42" rx="8" fill="#F1F3FF" stroke="#E5E7EB"/>
  <text x="136" y="1007" class="small" style="fill:#141B2B"><tspan style="font-weight:700">Current version:</tspan> browser demo, schedules saved locally, Leeds CRM feeds enrolments. <tspan style="font-weight:700">Next phase:</tspan> backend, automated college reminder emails, shared access, audit trail, payment receipt sync.</text>
