  <rect x="1230" y="350" width="170" height="62" rx="8" class="panel2"/><text x="1250" y="386" class="small" style="font-weight:700;fill:#141B2B">Instalment Schedule</text>
  <rect x="1420" y="350" width="170" height="62" rx="8" class="panel2"/><text x="1444" y="386" class="small" style="font-weight:700;fill:#141B2B">College Reminders</text>
  <rect x="1040" y="434" width="170" height="62" rx="8" class="panel2"/><text x="1083" y="470" class="small" style="font-weight:700;fill:#141B2B">Receipts Log</text>
  <rect x="1230" y="434" width="170" height="62" rx="8" class="panel2"/><text x="1274" y="470" class="small" style="font-weight:700;fill:#141B2B">Forecast</text>
  <rect x="1420" y="434" width="170" height="62" rx="8" class="panel2"/><text x="1481" y="470" class="small" style="font-weight:700;fill:#141B2B">Reports</text>

  <rect x="155" y="690" width="465" height="230" rx="14" class="panel"/>
  <text x="155" y="656" class="label">Data Layer — Current Demo</text>
  <rect x="206" y="734" width="70" height="70" rx="12" fill="url(#blue)"/><text x="222" y="780" class="icon">💾</text>
  <text x="302" y="758" class="h">Browser Storage</text>
  <text x="302" y="790" class="t">Schedules and receipts</text>
  <text x="302" y="816" class="t">saved on the user's device</text>
  <text x="206" y="862" class="small">• Fast interactive demo</text>
  <text x="206" y="892" class="small">• CSV export with instalments</text>

  <rect x="725" y="690" width="450" height="230" rx="14" fill="#F8FAFC" stroke="#C4C5D7" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="725" y="656" class="label">Production Upgrade Path</text>
