  <rect class="bg" width="1800" height="1100"/>
  <rect x="64" y="56" width="1672" height="988" rx="28" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="112" y="130" class="title">Boomerang Commission Tracker — System Architecture</text>
  <text x="112" y="166" class="sub">Post-enrolment commission tracking with multi-instalment schedules, college reminders, and payment forecasting.</text>
  <rect x="1372" y="82" width="290" height="56" rx="8" fill="#1D4ED8"/><text x="1403" y="117" class="white" style="font-family:Inter,Arial;font-size:18px;font-weight:700">wu.autotask.solutions</text>

