<svg width="1800" height="1100" viewBox="0 0 1800 1100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#111827" flood-opacity="0.08"/></filter>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1D4ED8"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10" stroke="#1D4ED8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .bg{fill:#F9FAFB}.panel{fill:white;stroke:#E5E7EB;stroke-width:2;filter:url(#shadow)}.panel2{fill:#F1F3FF;stroke:#C4C5D7;stroke-width:2}.title{font-family:'Hanken Grotesk','Inter',Arial,sans-serif;font-size:44px;font-weight:800;fill:#141B2B;letter-spacing:-1px}.sub{font-family:'Inter',Arial,sans-serif;font-size:21px;fill:#434655}.h{font-family:'Hanken Grotesk','Inter',Arial,sans-serif;font-size:25px;font-weight:700;fill:#141B2B}.t{font-family:'Inter',Arial,sans-serif;font-size:17px;fill:#434655}.small{font-family:'Inter',Arial,sans-serif;font-size:15px;fill:#747686}.label{font-family:'Inter',Arial,sans-serif;font-size:14px;font-weight:700;fill:#1D4ED8;text-transform:uppercase;letter-spacing:1px}.white{fill:white}.chip{fill:#DCE1FF;stroke:#B7C4FF;stroke-width:1}.line{stroke:#1D4ED8;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#747686;stroke-width:2;stroke-dasharray:8 8;fill:none}.icon{font-family:Arial,sans-serif;font-size:30px;fill:white}.num{font-family:'Hanken Grotesk','Inter',Arial,sans-serif;font-size:25px;font-weight:800;fill:#1D4ED8}
    </style>
