  <text x="210" y="344" class="t">Counsellors / Admins</text>
  <text x="140" y="398" class="small">• Desktop browser</text>
  <text x="140" y="427" class="small">• Tablet and mobile view</text>
  <text x="140" y="456" class="small">• No install required</text>

  <rect x="505" y="238" width="390" height="265" rx="14" fill="#F8FAFC" stroke="#C4C5D7" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="505" y="204" class="label">Upstream — Existing</text>
  <rect x="552" y="276" width="70" height="70" rx="12" fill="#6366F1"/><text x="568" y="322" class="icon">🎓</text>
